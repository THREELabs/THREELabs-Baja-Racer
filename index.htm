<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>BAJA BLAST — Desert Truck Racer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --sand: #e8cf9a;
      --ink: #1a1207;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #120d06;
      background-image: radial-gradient(circle at 50% 0%, #3a2a12 0%, #120d06 70%);
      color: var(--sand);
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      overscroll-behavior: none;
    }

    #shell {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    #frame {
      position: relative;
      border: 6px solid #4a3418;
      border-radius: 8px;
      box-shadow: 0 0 0 3px #17100a, 0 20px 60px rgba(0, 0, 0, .8);
      background: #000;
      line-height: 0;
    }

    canvas {
      display: block;
      width: min(96vw, calc(88vh * 4 / 3));
      height: auto;
      aspect-ratio: 4/3;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #legend {
      font-size: 12px;
      letter-spacing: 1px;
      text-align: center;
      opacity: .75;
      max-width: 90vw;
    }

    #legend b {
      color: #ffd479;
    }

    /* touch controls (Bootstrap) */
    #pad {
      width: 100%;
      max-width: 600px;
      display: none;
      z-index: 100;
    }

    #pad button {
      user-select: none;
      touch-action: none;
      transition: all 0.1s;
    }

    #pad button:active {
      filter: brightness(1.2);
      transform: scale(0.95);
    }

    @media (hover:none) {
      #pad {
        display: block;
      }

      #legend {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="shell">
    <div id="frame">
      <canvas id="game" width="640" height="480"></canvas>
    </div>
    <div id="pad" class="container mt-2 px-3">
      <div class="row gx-2">
        <div class="col-3">
          <button type="button" class="btn btn-outline-light w-100 py-3 fs-2 rounded-4 opacity-75" id="bL">◀</button>
        </div>
        <div class="col-3 d-flex flex-column gap-2">
          <button type="button" class="btn btn-outline-light w-100 py-3 fs-2 rounded-4 opacity-75" id="bR">▶</button>
          <button type="button" class="btn btn-warning w-100 flex-fill fs-6 fw-bold rounded-4 shadow"
            id="bN">NITRO</button>
        </div>
        <div class="col-6 d-flex gap-2">
          <button type="button" class="btn btn-outline-danger flex-fill fs-5 fw-bold rounded-4 opacity-75"
            id="bB">BRK</button>
          <button type="button" class="btn btn-success flex-fill fs-4 fw-bold rounded-4 shadow-lg" id="bA">GAS</button>
        </div>
      </div>
    </div>
    <div id="legend">
      <b>↑/W</b> gas &nbsp; <b>↓/S</b> brake &nbsp; <b>←→/AD</b> steer &nbsp;
      <b>SHIFT / SPACE</b> nitro &nbsp; <b>ENTER</b> start/restart &nbsp; <b>P</b> pause &nbsp; <b>M</b> mute
    </div>
    <div id="ytplayer" style="position:absolute; left:-9999px; width:1px; height:1px; opacity:0; pointer-events:none;">
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var ytPlayer = null;
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytplayer', {
        height: '1', width: '1',
        videoId: '0yyNBHqS8AI',
        playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': '0yyNBHqS8AI', 'playsinline': 1 }
      });
    }
  </script>
  <script>
    (function () {
      'use strict';

      /* =========================================================================
         0. UTILITIES
         ========================================================================= */
      const rnd = Math.random;
      const PI = Math.PI;
      function limit(v, lo, hi) { return Math.max(lo, Math.min(v, hi)); }
      function interpolate(a, b, p) { return a + (b - a) * p; }
      function easeIn(a, b, p) { return a + (b - a) * Math.pow(p, 2); }
      function easeOut(a, b, p) { return a + (b - a) * (1 - Math.pow(1 - p, 2)); }
      function easeInOut(a, b, p) { return a + (b - a) * (-Math.cos(p * PI) / 2 + 0.5); }
      function percentRemaining(n, total) { return (n % total) / total; }
      function increase(start, inc, max) { let r = start + inc; while (r >= max) r -= max; while (r < 0) r += max; return r; }
      function accelerate(v, a, dt) { return v + a * dt; }
      function randomInt(a, b) { return Math.round(interpolate(a, b, rnd())); }
      function randomChoice(arr) { return arr[randomInt(0, arr.length - 1)]; }
      function expFog(d, density) { return 1 / Math.pow(Math.E, d * d * density); }
      function overlap(x1, w1, x2, w2, pct) {
        const h = (pct || 1) / 2;
        const min1 = x1 - w1 * h, max1 = x1 + w1 * h, min2 = x2 - w2 * h, max2 = x2 + w2 * h;
        return !((max1 < min2) || (min1 > max2));
      }
      function fmtTime(t) {
        if (t === null || t === undefined) return "--'--\"--";
        const m = Math.floor(t / 60), s = Math.floor(t - m * 60), h = Math.floor(100 * (t - Math.floor(t)));
        return m + "'" + (s < 10 ? '0' : '') + s + '"' + (h < 10 ? '0' : '') + h;
      }
      function pad(n, len) { let s = '' + Math.floor(n); while (s.length < len) s = '0' + s; return s; }

      /* =========================================================================
         1. CANVAS
         ========================================================================= */
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const HORIZON = H / 2;
      ctx.imageSmoothingEnabled = true;

      function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
      function mkSprite(w, h, fn) {
        const c = mkCanvas(w, h), g = c.getContext('2d');
        g.save(); fn(g, w, h); g.restore();
        return { img: c, w: w, h: h };
      }
      function roundRect(g, x, y, w, h, r) {
        g.beginPath();
        g.moveTo(x + r, y);
        g.arcTo(x + w, y, x + w, y + h, r);
        g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r);
        g.arcTo(x, y, x + w, y, r);
        g.closePath();
      }
      function poly(g, pts, fill) {
        g.fillStyle = fill; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
        g.closePath(); g.fill();
      }

      /* =========================================================================
         2. SPRITE ART (all procedural)
         ========================================================================= */

      /* ---- trucks -------------------------------------------------------------- */
      function drawTire(g, x, y, w, h) {
        g.fillStyle = '#17171b'; roundRect(g, x, y, w, h, 9); g.fill();
        g.fillStyle = '#2b2b32';
        for (let i = 0; i < 6; i++) g.fillRect(x + 3, y + 9 + i * ((h - 16) / 6), w - 6, 4);
        g.fillStyle = '#9a9aa4';
        g.beginPath(); g.ellipse(x + w / 2, y + h * 0.63, w * 0.27, h * 0.19, 0, 0, PI * 2); g.fill();
        g.fillStyle = '#5a5a63';
        g.beginPath(); g.ellipse(x + w / 2, y + h * 0.63, w * 0.12, h * 0.085, 0, 0, PI * 2); g.fill();
      }
      function drawTruck(g, p, lean) {
        lean = lean || 0;
        // trailing dust
        for (let i = 0; i < 14; i++) {
          g.fillStyle = 'rgba(228,206,158,' + (0.07 + rnd() * 0.11).toFixed(3) + ')';
          g.beginPath(); g.arc(14 + rnd() * 172, 104 + rnd() * 30, 9 + rnd() * 20, 0, PI * 2); g.fill();
        }
        g.save();
        g.translate(100, 80); g.rotate(lean * 0.045); g.translate(-100, -80);
        // ground shadow removed for jumping
        // tires
        drawTire(g, 6 + lean * 5, 60, 46, 72);
        drawTire(g, 148 + lean * 5, 60, 46, 72);
        // axle + shocks
        g.fillStyle = '#3a3a42'; g.fillRect(40, 94, 120, 11);
        g.fillStyle = '#c9ced6'; g.fillRect(52, 64, 8, 34); g.fillRect(140, 64, 8, 34);
        // body
        g.fillStyle = p.body; roundRect(g, 42, 42, 116, 60, 11); g.fill();
        g.fillStyle = p.bodyDark; g.fillRect(42, 84, 116, 18);
        g.fillStyle = p.accent; g.fillRect(46, 68, 108, 9);
        // rear window / cab
        g.fillStyle = '#1d2028'; roundRect(g, 58, 24, 84, 26, 6); g.fill();
        g.fillStyle = 'rgba(255,255,255,.10)'; g.fillRect(62, 28, 34, 8);
        // roll cage
        g.strokeStyle = p.cage; g.lineWidth = 6; g.lineJoin = 'round'; g.lineCap = 'round';
        g.beginPath(); g.moveTo(50, 52); g.lineTo(56, 18); g.lineTo(144, 18); g.lineTo(150, 52); g.stroke();
        g.beginPath(); g.moveTo(60, 18); g.lineTo(100, 11); g.lineTo(140, 18); g.stroke();
        g.beginPath(); g.moveTo(56, 34); g.lineTo(144, 34); g.stroke();
        // light bar
        g.fillStyle = '#25252b'; g.fillRect(60, 3, 80, 11);
        g.fillStyle = '#ffe483'; for (let i = 0; i < 4; i++) g.fillRect(64 + i * 19, 5, 13, 7);
        // tail lights
        g.fillStyle = '#ff3a2f'; g.fillRect(48, 72, 17, 11); g.fillRect(135, 72, 17, 11);
        g.fillStyle = '#ffb0a8'; g.fillRect(50, 74, 13, 4); g.fillRect(137, 74, 13, 4);
        // number roundel
        g.fillStyle = '#f4f2ea'; g.beginPath(); g.arc(100, 64, 15, 0, PI * 2); g.fill();
        g.fillStyle = '#1b1b1f'; g.font = 'bold 20px "Courier New",monospace';
        g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(p.num, 100, 65);
        // bumper / flaps
        g.fillStyle = '#4c4c55'; g.fillRect(38, 102, 124, 9);
        g.fillStyle = '#6d6d78'; g.fillRect(34, 99, 10, 14); g.fillRect(156, 99, 10, 14);
        g.fillStyle = '#24242a'; g.fillRect(46, 105, 22, 17); g.fillRect(132, 105, 22, 17);
        // exhaust stacks
        g.fillStyle = '#b9bec7'; g.fillRect(70, 16, 7, 10); g.fillRect(123, 16, 7, 10);
        g.restore();
      }
      function truckSprite(p, lean, widthPx) {
        const s = widthPx / 200;
        return mkSprite(Math.round(200 * s), Math.round(142 * s), g => { g.scale(s, s); drawTruck(g, p, lean); });
      }

      const P_PLAYER = { body: '#e0441f', bodyDark: '#a52d12', accent: '#ffd23f', cage: '#2f3138', num: '7' };
      const PLAYER_STRAIGHT = truckSprite(P_PLAYER, 0, 200);
      const PLAYER_LEFT = truckSprite(P_PLAYER, -1, 200);
      const PLAYER_RIGHT = truckSprite(P_PLAYER, 1, 200);

      const RIVAL_PALETTES = [
        { body: '#2f6fd0', bodyDark: '#20508f', accent: '#f2f2f2', cage: '#2b2d33', num: '12' },
        { body: '#f0f0e6', bodyDark: '#bdbdb2', accent: '#e02020', cage: '#33353b', num: '21' },
        { body: '#20a05a', bodyDark: '#16733f', accent: '#ffe14d', cage: '#2b2d33', num: '34' },
        { body: '#8a2be2', bodyDark: '#5f1e9c', accent: '#00e0d0', cage: '#2b2d33', num: '46' },
        { body: '#ff9d16', bodyDark: '#c1720c', accent: '#1b1b1f', cage: '#2b2d33', num: '55' },
        { body: '#1d1f24', bodyDark: '#0f1013', accent: '#ff5a1f', cage: '#54565e', num: '68' },
        { body: '#00b7c8', bodyDark: '#00808c', accent: '#ffffff', cage: '#2b2d33', num: '73' },
        { body: '#b0132f', bodyDark: '#7d0d21', accent: '#f6d68a', cage: '#2b2d33', num: '99' }
      ];
      const CAR_SPRITES = RIVAL_PALETTES.map((p, i) => truckSprite(p, 0, i % 3 === 0 ? 172 : (i % 3 === 1 ? 196 : 214)));

      /* ---- scenery ------------------------------------------------------------- */
      const SPRITES = {};

      SPRITES.CACTUS = mkSprite(150, 252, g => {
        g.fillStyle = '#a98a55'; g.beginPath(); g.ellipse(75, 244, 36, 10, 0, 0, PI * 2); g.fill();
        g.lineCap = 'round'; g.lineJoin = 'round';
        const arms = [
          [[75, 246], [75, 64]],
          [[75, 158], [36, 158], [36, 104]],
          [[75, 192], [116, 192], [116, 124]]
        ];
        g.strokeStyle = '#28401e'; g.lineWidth = 42;
        arms.forEach(a => { g.beginPath(); g.moveTo(a[0][0], a[0][1]); for (let i = 1; i < a.length; i++) g.lineTo(a[i][0], a[i][1]); g.stroke(); });
        g.strokeStyle = '#436b2c'; g.lineWidth = 30;
        arms.forEach(a => { g.beginPath(); g.moveTo(a[0][0], a[0][1]); for (let i = 1; i < a.length; i++) g.lineTo(a[i][0], a[i][1]); g.stroke(); });
        g.strokeStyle = '#68984a'; g.lineWidth = 9;
        g.beginPath(); g.moveTo(66, 238); g.lineTo(66, 70); g.stroke();
        g.strokeStyle = 'rgba(235,245,205,.45)'; g.lineWidth = 2;
        for (let y = 80; y < 235; y += 13) { g.beginPath(); g.moveTo(58, y); g.lineTo(92, y); g.stroke(); }
      });

      SPRITES.CACTUS_SM = mkSprite(110, 150, g => {
        g.fillStyle = '#a98a55'; g.beginPath(); g.ellipse(55, 143, 26, 8, 0, 0, PI * 2); g.fill();
        g.lineCap = 'round'; g.lineJoin = 'round';
        g.strokeStyle = '#28401e'; g.lineWidth = 32;
        g.beginPath(); g.moveTo(55, 144); g.lineTo(55, 44); g.stroke();
        g.beginPath(); g.moveTo(55, 96); g.lineTo(88, 96); g.lineTo(88, 64); g.stroke();
        g.strokeStyle = '#4a7532'; g.lineWidth = 21;
        g.beginPath(); g.moveTo(55, 144); g.lineTo(55, 44); g.stroke();
        g.beginPath(); g.moveTo(55, 96); g.lineTo(88, 96); g.lineTo(88, 64); g.stroke();
      });

      SPRITES.ROCK = mkSprite(196, 124, g => {
        poly(g, [[8, 120], [38, 58], [74, 40], [116, 56], [152, 46], [190, 120]], '#7d6749');
        poly(g, [[38, 120], [70, 52], [104, 68], [128, 120]], '#9a8460');
        poly(g, [[128, 120], [152, 50], [176, 74], [190, 120]], '#8d7654');
        g.fillStyle = 'rgba(255,240,200,.22)';
        poly(g, [[70, 54], [92, 62], [76, 86], [62, 72]], 'rgba(255,240,200,.22)');
        g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, 116, 196, 8);
      });

      SPRITES.BOULDERS = mkSprite(260, 120, g => {
        poly(g, [[4, 116], [40, 52], [86, 40], [130, 60], [150, 116]], '#6f5c40');
        poly(g, [[120, 116], [160, 64], [210, 52], [256, 116]], '#8b7554');
        poly(g, [[40, 116], [76, 56], [110, 72], [124, 116]], '#9a8460');
        g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(0, 112, 260, 8);
      });

      SPRITES.BUSH = mkSprite(160, 84, g => {
        const c = ['#6a7a3a', '#7d8f47', '#586a2e'];
        for (let i = 0; i < 9; i++) {
          g.fillStyle = c[i % 3];
          g.beginPath(); g.arc(24 + i * 15, 62 - ((i * 37) % 22), 20 + ((i * 13) % 10), 0, PI * 2); g.fill();
        }
        g.fillStyle = '#a98a55'; g.beginPath(); g.ellipse(80, 78, 60, 8, 0, 0, PI * 2); g.fill();
      });

      SPRITES.PALM = mkSprite(200, 336, g => {
        g.fillStyle = '#a98a55'; g.beginPath(); g.ellipse(98, 330, 40, 9, 0, 0, PI * 2); g.fill();
        g.strokeStyle = '#6d4f2b'; g.lineWidth = 17; g.lineCap = 'round';
        g.beginPath(); g.moveTo(98, 328); g.quadraticCurveTo(78, 206, 104, 104); g.stroke();
        g.strokeStyle = '#87643a'; g.lineWidth = 7;
        g.beginPath(); g.moveTo(94, 326); g.quadraticCurveTo(74, 206, 100, 106); g.stroke();
        for (let i = 0; i < 8; i++) {
          const a = -PI / 2 + (i - 3.5) * 0.42;
          const tx = 104 + Math.cos(a) * 96, ty = 104 + Math.sin(a) * 86;
          g.fillStyle = i % 2 ? '#2c6a33' : '#3a8140';
          g.beginPath();
          g.moveTo(104, 104);
          g.quadraticCurveTo(104 + Math.cos(a) * 60 - 16, 104 + Math.sin(a) * 54, tx, ty);
          g.quadraticCurveTo(104 + Math.cos(a) * 60 + 16, 104 + Math.sin(a) * 54 + 12, 104, 104);
          g.fill();
        }
        g.fillStyle = '#7d5b2f';
        g.beginPath(); g.arc(104, 102, 13, 0, PI * 2); g.fill();
      });

      SPRITES.BARREL = mkSprite(86, 112, g => {
        g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(43, 106, 32, 7, 0, 0, PI * 2); g.fill();
        g.fillStyle = '#e2621f'; roundRect(g, 10, 14, 66, 92, 8); g.fill();
        g.fillStyle = '#f5f0e4'; g.fillRect(10, 40, 66, 16); g.fillRect(10, 74, 66, 10);
        g.fillStyle = '#b64a12'; g.fillRect(10, 14, 10, 92);
        g.fillStyle = '#ffa268'; g.beginPath(); g.ellipse(43, 16, 33, 8, 0, 0, PI * 2); g.fill();
      });

      SPRITES.TIRES = mkSprite(150, 96, g => {
        g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(75, 90, 66, 8, 0, 0, PI * 2); g.fill();
        const t = (x, y) => {
          g.fillStyle = '#1b1b20'; roundRect(g, x, y, 54, 26, 12); g.fill();
          g.fillStyle = '#33333a'; g.fillRect(x + 6, y + 9, 42, 7);
        };
        t(6, 62); t(66, 62); t(36, 36); t(24, 12);
      });

      SPRITES.POLE = mkSprite(56, 214, g => {
        g.fillStyle = '#efe6d0'; g.fillRect(22, 26, 12, 186);
        g.fillStyle = '#d93b28'; for (let y = 30; y < 210; y += 42) g.fillRect(22, y, 12, 20);
        g.fillStyle = '#ffcf3f'; poly(g, [[34, 20], [54, 32], [34, 44]], '#ffcf3f');
      });

      function billboard(title, sub, bg, fg) {
        return mkSprite(452, 306, g => {
          g.fillStyle = '#5a4530'; g.fillRect(74, 186, 22, 120); g.fillRect(356, 186, 22, 120);
          g.fillStyle = '#6b563c'; g.fillRect(74, 220, 304, 12);
          g.fillStyle = '#2b2b31'; g.fillRect(18, 8, 416, 196);
          g.fillStyle = bg; g.fillRect(26, 16, 400, 180);
          g.strokeStyle = fg; g.lineWidth = 6; g.strokeRect(40, 28, 372, 152);
          g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
          g.font = 'bold 62px "Courier New",monospace'; g.fillText(title, 226, 88);
          g.font = 'bold 34px "Courier New",monospace'; g.fillText(sub, 226, 146);
        });
      }
      const BILLBOARDS = [
        billboard('BAJA', '1000 KM', '#12212f', '#ffd75e'),
        billboard('NITRO', 'FUEL CO.', '#2a0f12', '#ff6a3d'),
        billboard('TROPHY', 'TRUCKS', '#123020', '#a8f0b0'),
        billboard('DESERT', '500', '#332a08', '#ffe9a8'),
        billboard('RAD', 'MOTOR OIL', '#1d1230', '#ff8ad0')
      ];

      function arch(label, color) {
        return mkSprite(1400, 470, g => {
          // towers
          g.fillStyle = '#3b3b44'; g.fillRect(56, 110, 74, 360); g.fillRect(1270, 110, 74, 360);
          g.strokeStyle = '#5e5e6c'; g.lineWidth = 6;
          for (let y = 130; y < 460; y += 44) {
            g.beginPath(); g.moveTo(56, y); g.lineTo(130, y + 30); g.stroke();
            g.beginPath(); g.moveTo(1270, y + 30); g.lineTo(1344, y); g.stroke();
          }
          // banner
          g.fillStyle = color; g.fillRect(80, 34, 1240, 120);
          g.fillStyle = '#1b1b1f'; g.fillRect(80, 34, 1240, 10); g.fillRect(80, 144, 1240, 10);
          // checker strip
          for (let i = 0; i < 62; i++) { g.fillStyle = (i % 2) ? '#f2f2ea' : '#1b1b1f'; g.fillRect(80 + i * 20, 150, 20, 18); }
          g.fillStyle = '#fffbe8'; g.textAlign = 'center'; g.textBaseline = 'middle';
          g.font = 'bold 84px "Courier New",monospace';
          g.fillText(label, 700, 96);
          // side supports
          g.fillStyle = '#2d2d35'; g.fillRect(60, 160, 66, 16); g.fillRect(1274, 160, 66, 16);
        });
      }
      SPRITES.ARCH_START = arch('START / FINISH', '#c8262c');
      SPRITES.ARCH_CP = arch('CHECKPOINT', '#1d7fbf');
      SPRITES.ARCH_START.nc = SPRITES.ARCH_CP.nc = true;

      const DESERT_PROPS = [SPRITES.CACTUS, SPRITES.CACTUS_SM, SPRITES.BUSH, SPRITES.ROCK, SPRITES.BOULDERS, SPRITES.PALM];
      const HAZARDS = [SPRITES.BARREL, SPRITES.TIRES, SPRITES.ROCK];

      /* ---- parallax background layers ----------------------------------------- */
      const LAYER_W = 1280;

      const CLOUDS = mkSprite(LAYER_W, 150, g => {
        for (let i = 0; i < 26; i++) {
          const x = rnd() * LAYER_W, y = 10 + rnd() * 90, s = 0.55 + rnd() * 1.1;
          g.fillStyle = 'rgba(255,238,214,' + (0.22 + rnd() * 0.35).toFixed(2) + ')';
          for (let k = 0; k < 5; k++) {
            g.beginPath();
            g.ellipse(x + k * 22 * s - 40 * s, y + ((k % 2) ? 6 : 0) * s, (26 + rnd() * 16) * s, (11 + rnd() * 7) * s, 0, 0, PI * 2);
            g.fill();
          }
        }
      });

      const MOUNTAINS = mkSprite(LAYER_W, 190, g => {
        function ridge(baseY, h, color, step, seed) {
          g.fillStyle = color; g.beginPath(); g.moveTo(0, 190);
          for (let x = 0; x <= LAYER_W; x += step) {
            const y = baseY - h * (0.45 + 0.55 * Math.abs(Math.sin(x * 0.0043 + seed) + 0.5 * Math.sin(x * 0.011 + seed * 2)) / 1.5);
            g.lineTo(x, y);
          }
          g.lineTo(LAYER_W, 190); g.closePath(); g.fill();
        }
        ridge(120, 110, '#8a6f8f', 26, 0.4);   // far range
        ridge(150, 96, '#7a5c62', 22, 1.9);    // mid range
        ridge(178, 70, '#6a4a3a', 18, 3.3);    // near range
        // snowless highlights
        g.fillStyle = 'rgba(255,220,180,.16)';
        for (let x = 0; x < LAYER_W; x += 64) { g.fillRect(x, 150 - ((x * 7) % 40), 26, 6); }
      });

      const DUNES = mkSprite(LAYER_W, 120, g => {
        function dune(baseY, h, c, seed) {
          g.fillStyle = c; g.beginPath(); g.moveTo(0, 120);
          for (let x = 0; x <= LAYER_W; x += 14) {
            const y = baseY - h * (0.5 + 0.5 * Math.sin(x * 0.009 + seed));
            g.lineTo(x, y);
          }
          g.lineTo(LAYER_W, 120); g.closePath(); g.fill();
        }
        dune(74, 36, '#c9a86a', 0.7);
        dune(96, 26, '#b9955a', 2.4);
        // silhouetted cacti on the ridge
        g.fillStyle = '#7d6a3f';
        for (let i = 0; i < 20; i++) {
          const x = rnd() * LAYER_W, hh = 12 + rnd() * 18, y = 88 - rnd() * 14;
          g.fillRect(x, y - hh, 5, hh);
          if (rnd() < 0.6) { g.fillRect(x - 8, y - hh * 0.7, 8, 4); g.fillRect(x - 8, y - hh * 0.7, 4, hh * 0.4); }
        }
      });

      /* =========================================================================
         3. GAME CONSTANTS
         ========================================================================= */
      const segmentLength = 200;
      const rumbleLength = 3;
      const roadWidth = 2200;
      const lanes = 3;
      const fieldOfView = 100;
      const cameraHeight = 1300;
      const cameraDepth = 1 / Math.tan((fieldOfView / 2) * PI / 180);
      const drawDistance = 280;
      const fogDensity = 4.2;
      const playerZ = cameraHeight * cameraDepth;
      const maxSpeed = segmentLength * 60;          // units / second
      const accelRate = maxSpeed / 4.2;
      const brakeRate = -maxSpeed / 1.1;
      const decelRate = -maxSpeed / 6.5;
      const offRoadDecel = -maxSpeed / 1.5;
      const offRoadLimit = maxSpeed / 3.4;
      const centrifugal = 0.34;
      const nitroFactor = 1.24;
      const totalLaps = 3;
      const totalCars = 18;
      const startTime = 75;
      const cpBonus = 22;
      const lapBonus = 28;

      const SPRITE_SCALE = 0.3 * (1 / PLAYER_STRAIGHT.w);
      const playerW = PLAYER_STRAIGHT.w * SPRITE_SCALE;

      const COLORS = {
        LIGHT: { road: '#8b6b45', grass: '#c9a869', rumble: '#f0e6c8', lane: '#f2ead0' },
        DARK: { road: '#7e6040', grass: '#bd9b5c', rumble: '#b23a26' },
        START: { road: '#e8e8e0', grass: '#c9a869', rumble: '#e8e8e0' },
        FINISH: { road: '#25252a', grass: '#c9a869', rumble: '#25252a' },
        FOG: '#e7d3a2',
        GROUND: '#c09a58'
      };

      const ROAD = {
        LENGTH: { NONE: 0, SHORT: 25, MEDIUM: 50, LONG: 100 },
        HILL: { NONE: 0, LOW: 22, MEDIUM: 44, HIGH: 66 },
        CURVE: { NONE: 0, EASY: 2, MEDIUM: 4, HARD: 6.5 }
      };

      /* =========================================================================
         4. TRACK CONSTRUCTION
         ========================================================================= */
      let segments = [], cars = [], trackLength = 0, checkpoints = [];

      function lastY() { return segments.length === 0 ? 0 : segments[segments.length - 1].p2.world.y; }
      function findSegment(z) { return segments[Math.floor(z / segmentLength) % segments.length]; }

      function addSegment(curve, y) {
        const n = segments.length;
        segments.push({
          index: n,
          p1: { world: { x: 0, y: lastY(), z: n * segmentLength }, camera: {}, screen: {} },
          p2: { world: { x: 0, y: y, z: (n + 1) * segmentLength }, camera: {}, screen: {} },
          curve: curve, sprites: [], cars: [], looped: false, fog: 0, clip: 0,
          color: Math.floor(n / rumbleLength) % 2 ? COLORS.DARK : COLORS.LIGHT
        });
      }
      function addRoad(enter, hold, leave, curve, y) {
        const startY = lastY(), endY = startY + (y || 0) * segmentLength, total = enter + hold + leave;
        for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(startY, endY, n / total));
        for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(startY, endY, (enter + n) / total));
        for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(startY, endY, (enter + hold + n) / total));
      }
      function addStraight(num) { num = num || ROAD.LENGTH.MEDIUM; addRoad(num, num, num, 0, 0); }
      function addHill(num, height) { num = num || ROAD.LENGTH.MEDIUM; height = height || ROAD.HILL.MEDIUM; addRoad(num, num, num, 0, height); }
      function addCurve(num, curve, height) {
        num = num || ROAD.LENGTH.MEDIUM; curve = curve || ROAD.CURVE.MEDIUM; height = height || 0;
        addRoad(num, num, num, curve, height);
      }
      function addLowRollingHills(num, height) {
        num = num || ROAD.LENGTH.SHORT; height = height || ROAD.HILL.LOW;
        addRoad(num, num, num, 0, height / 2);
        addRoad(num, num, num, 0, -height);
        addRoad(num, num, num, ROAD.CURVE.EASY, height);
        addRoad(num, num, num, 0, 0);
        addRoad(num, num, num, -ROAD.CURVE.EASY, height / 2);
        addRoad(num, num, num, 0, 0);
      }
      function addSCurves() {
        addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.EASY, ROAD.HILL.NONE);
        addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.CURVE.MEDIUM, ROAD.HILL.MEDIUM);
        addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.CURVE.EASY, -ROAD.HILL.LOW);
        addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.EASY, ROAD.HILL.MEDIUM);
        addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.MEDIUM, -ROAD.HILL.MEDIUM);
      }
      function addBumps() {
        const b = [5, -2, -5, 8, 5, -7, 3, -2, 4, -3, -4, 2, -2, 5, -4];
        b.forEach(v => addRoad(10, 10, 10, 0, v));
      }
      function addDownhillToEnd(num) {
        num = num || 200;
        addRoad(num, num, num, -ROAD.CURVE.EASY, -lastY() / segmentLength);
      }

      function addJumps() {
        addRoad(15, 15, 15, 0, ROAD.HILL.HIGH);
        addRoad(15, 15, 15, 0, -ROAD.HILL.HIGH);
        addRoad(15, 15, 15, 0, ROAD.HILL.HIGH);
        addRoad(15, 15, 15, 0, -ROAD.HILL.HIGH);
        addRoad(15, 15, 15, 0, ROAD.HILL.HIGH);
        addRoad(15, 15, 15, 0, -ROAD.HILL.HIGH);
      }

      function addSprite(n, source, offset, center) {
        if (!segments[n]) return;
        segments[n].sprites.push({ source: source, offset: offset, center: !!center });
      }

      function resetRoad() {
        segments = [];
        addStraight(ROAD.LENGTH.SHORT);
        addLowRollingHills();
        addJumps();
        addSCurves();
        addCurve(ROAD.LENGTH.MEDIUM, ROAD.CURVE.MEDIUM, ROAD.HILL.LOW);
        addBumps();
        addJumps();
        addLowRollingHills();
        addCurve(ROAD.LENGTH.LONG * 2, ROAD.CURVE.MEDIUM, ROAD.HILL.MEDIUM);
        addStraight();
        addHill(ROAD.LENGTH.SHORT, ROAD.HILL.HIGH);
        addHill(ROAD.LENGTH.SHORT, -ROAD.HILL.HIGH);
        addSCurves();
        addCurve(ROAD.LENGTH.LONG, -ROAD.CURVE.MEDIUM, ROAD.HILL.NONE);
        addHill(ROAD.LENGTH.LONG, ROAD.HILL.HIGH);
        addJumps();
        addCurve(ROAD.LENGTH.LONG, ROAD.CURVE.HARD, -ROAD.HILL.LOW);
        addBumps();
        addHill(ROAD.LENGTH.LONG, -ROAD.HILL.MEDIUM);
        addStraight();
        addSCurves();
        addDownhillToEnd();

        trackLength = segments.length * segmentLength;

        // start / finish paint
        const s0 = findSegment(playerZ).index;
        segments[s0 + 2].color = COLORS.START;
        segments[s0 + 3].color = COLORS.START;
        for (let n = 0; n < rumbleLength; n++) segments[segments.length - 1 - n].color = COLORS.FINISH;

        // checkpoints at 1/4, 1/2, 3/4 of the loop
        checkpoints = [0.25, 0.5, 0.75].map(f => {
          const idx = Math.floor(segments.length * f);
          return { index: idx, z: idx * segmentLength };
        });
      }

      function resetSprites() {
        const N = segments.length;

        addSprite(8, SPRITES.ARCH_START, 0, true);
        checkpoints.forEach(cp => addSprite(cp.index, SPRITES.ARCH_CP, 0, true));

        for (let n = 0; n < N; n++) {
          // edge marker poles
          if (n % 14 === 0) { addSprite(n, SPRITES.POLE, -1.14); addSprite(n, SPRITES.POLE, 1.14); }
          // billboards
          if (n % 52 === 26) addSprite(n, randomChoice(BILLBOARDS), randomChoice([-2.4, 2.4]));
          // dense desert props
          if (rnd() < 0.30) addSprite(n, randomChoice(DESERT_PROPS), (1.5 + rnd() * 4.2) * randomChoice([-1, 1]));
          if (rnd() < 0.12) addSprite(n, randomChoice([SPRITES.CACTUS, SPRITES.BOULDERS, SPRITES.BUSH]), (5 + rnd() * 8) * randomChoice([-1, 1]));
          // roadside hazards close to the ribbon
          if (rnd() < 0.05) addSprite(n, randomChoice(HAZARDS), (1.2 + rnd() * 0.5) * randomChoice([-1, 1]));
        }
        // small oasis of palms
        for (let n = Math.floor(N * 0.55); n < Math.floor(N * 0.55) + 40; n += 3) {
          addSprite(n, SPRITES.PALM, 1.6 + rnd());
          addSprite(n, SPRITES.PALM, -1.6 - rnd());
        }
      }

      function resetCars() {
        cars = [];
        for (let n = 0; n < totalCars; n++) {
          const offset = rnd() * randomChoice([-0.85, 0.85]);
          const z = Math.floor(rnd() * segments.length) * segmentLength;
          const sprite = randomChoice(CAR_SPRITES);
          const sp = maxSpeed / 4.2 + rnd() * maxSpeed / (sprite.w > 200 ? 4.2 : 3.1);
          const car = { offset: offset, z: z, sprite: sprite, speed: sp, percent: 0 };
          findSegment(z).cars.push(car);
          cars.push(car);
        }
      }

      /* =========================================================================
         5. GAME STATE
         ========================================================================= */
      let state = 'title';           // title | countdown | racing | paused | over | finish
      let position = 0, playerX = 0, speed = 0, playerY = 0;
      let playerAltitude = 0, jumpVel = 0, isJumping = false;
      let lap = 1, currentLapTime = 0, lastLapTime = null, bestLapTime = null;
      let timeLeft = startTime, score = 0, odo = 0, nextCP = 0;
      let nitro = 1, boosting = false;
      let skyOffset = 0, hillOffset = 0, duneOffset = 0;
      let shake = 0, stateTimer = 0, msg = null, dust = [], flashCP = 0;
      let gameTime = 0;

      function resetGame() {
        position = 0; playerX = 0; speed = 0; playerY = 0;
        lap = 1; currentLapTime = 0; lastLapTime = null; bestLapTime = null;
        timeLeft = startTime; score = 0; odo = 0; nextCP = 0;
        nitro = 1; boosting = false; shake = 0; dust = []; msg = null; flashCP = 0;
        playerAltitude = 0; jumpVel = 0; isJumping = false;
        gameTime = 0;
        segments.forEach(s => s.cars = []);
        resetCars();
        state = 'countdown'; stateTimer = 3.4;
      }

      function buildWorld() {
        resetRoad();
        resetSprites();
        resetCars();
      }
      buildWorld();

      /* =========================================================================
         6. INPUT
         ========================================================================= */
      const keys = { left: false, right: false, gas: false, brake: false, nitro: false };
      const MAP = {
        ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
        ArrowUp: 'gas', KeyW: 'gas', ArrowDown: 'brake', KeyS: 'brake',
        ShiftLeft: 'nitro', ShiftRight: 'nitro', Space: 'nitro'
      };
      window.addEventListener('keydown', e => {
        if (MAP[e.code]) { keys[MAP[e.code]] = true; e.preventDefault(); }
        if (e.code === 'Enter') {
          Sound.init();
          if (state === 'title' || state === 'over' || state === 'finish') resetGame();
        }
        if (e.code === 'KeyP' && (state === 'racing' || state === 'paused'))
          state = (state === 'paused') ? 'racing' : 'paused';
        if (e.code === 'KeyM') Sound.toggle();
      }, { passive: false });
      window.addEventListener('keyup', e => { if (MAP[e.code]) { keys[MAP[e.code]] = false; e.preventDefault(); } }, { passive: false });

      window.addEventListener('pointerdown', () => {
        Sound.init();
        if (state === 'title' || state === 'over' || state === 'finish') resetGame();
      });

      document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
      document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });

      function bindBtn(id, k) {
        const el = document.getElementById(id);
        const on = e => {
          keys[k] = true;
          Sound.init();
          if (state === 'title' || state === 'over' || state === 'finish') resetGame();
          e.preventDefault();
          e.stopPropagation();
        };
        const off = e => { keys[k] = false; e.preventDefault(); e.stopPropagation(); };
        el.addEventListener('pointerdown', on);
        el.addEventListener('pointerup', off);
        el.addEventListener('pointercancel', off);
        el.addEventListener('pointerleave', off);
        el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); }, { passive: false });
      }
      bindBtn('bL', 'left'); bindBtn('bR', 'right'); bindBtn('bA', 'gas'); bindBtn('bB', 'brake'); bindBtn('bN', 'nitro');

      /* =========================================================================
         7. AUDIO (synthesised engine + effects)
         ========================================================================= */
      const Sound = {
        ac: null, on: true, master: null, o1: null, o2: null, lpf: null, eg: null,
        noise: null, ng: null, nf: null, ytStarted: false,
        init() {
          if (!this.ytStarted && window.ytPlayer && typeof window.ytPlayer.playVideo === 'function') {
            window.ytPlayer.playVideo();
            if (!this.on && typeof window.ytPlayer.mute === 'function') window.ytPlayer.mute();
            this.ytStarted = true;
          }
          if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          this.ac = new AC();
          this.master = this.ac.createGain(); this.master.gain.value = 0.5;
          this.master.connect(this.ac.destination);

          this.lpf = this.ac.createBiquadFilter();
          this.lpf.type = 'lowpass'; this.lpf.frequency.value = 900;
          this.eg = this.ac.createGain(); this.eg.gain.value = 0.0;
          this.o1 = this.ac.createOscillator(); this.o1.type = 'sawtooth'; this.o1.frequency.value = 50;
          this.o2 = this.ac.createOscillator(); this.o2.type = 'square'; this.o2.frequency.value = 51;
          this.o1.connect(this.lpf); this.o2.connect(this.lpf);
          this.lpf.connect(this.eg); this.eg.connect(this.master);
          this.o1.start(); this.o2.start();

          // gravel / off-road noise
          const len = this.ac.sampleRate * 2;
          const buf = this.ac.createBuffer(1, len, this.ac.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = (rnd() * 2 - 1) * 0.7;
          this.noise = this.ac.createBufferSource(); this.noise.buffer = buf; this.noise.loop = true;
          this.nf = this.ac.createBiquadFilter(); this.nf.type = 'bandpass'; this.nf.frequency.value = 1200; this.nf.Q.value = 0.8;
          this.ng = this.ac.createGain(); this.ng.gain.value = 0;
          this.noise.connect(this.nf); this.nf.connect(this.ng); this.ng.connect(this.master);
          this.noise.start();
        },
        toggle() {
          this.on = !this.on;
          if (this.master) this.master.gain.value = this.on ? 0.5 : 0;
          if (window.ytPlayer && typeof window.ytPlayer.mute === 'function') {
            if (this.on) window.ytPlayer.unMute(); else window.ytPlayer.mute();
          }
        },
        update(sp, off, boost, idle) {
          if (!this.ac) return;
          const t = this.ac.currentTime;
          const rpm = idle ? 0.16 + 0.05 * Math.sin(t * 9) : 0.10 + sp * 0.9;
          const f = 42 + rpm * 300 + (boost ? 40 : 0);
          this.o1.frequency.setTargetAtTime(f, t, 0.045);
          this.o2.frequency.setTargetAtTime(f * 1.007 + 1, t, 0.045);
          this.lpf.frequency.setTargetAtTime(600 + rpm * 2600 + (boost ? 900 : 0), t, 0.08);
          this.eg.gain.setTargetAtTime(0.055 + rpm * 0.10, t, 0.08);
          this.ng.gain.setTargetAtTime(off ? 0.10 + sp * 0.14 : 0.008 + sp * 0.012, t, 0.09);
          this.nf.frequency.setTargetAtTime(off ? 700 : 1600, t, 0.15);
        },
        blip(freq, dur, type, vol) {
          if (!this.ac || !this.on) return;
          const t = this.ac.currentTime;
          const o = this.ac.createOscillator(), g = this.ac.createGain();
          o.type = type || 'square'; o.frequency.value = freq;
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(vol || 0.18, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.15));
          o.connect(g); g.connect(this.master); o.start(t); o.stop(t + (dur || 0.15) + 0.02);
        },
        crash() {
          if (!this.ac || !this.on) return;
          const t = this.ac.currentTime, len = Math.floor(this.ac.sampleRate * 0.4);
          const b = this.ac.createBuffer(1, len, this.ac.sampleRate), d = b.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / len, 2);
          const s = this.ac.createBufferSource(); s.buffer = b;
          const f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1100;
          const g = this.ac.createGain(); g.gain.value = 0.5;
          s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
        }
      };

      /* =========================================================================
         8. PROJECTION + ROAD RENDER
         ========================================================================= */
      function project(p, camX, camY, camZ) {
        p.camera.x = (p.world.x || 0) - camX;
        p.camera.y = (p.world.y || 0) - camY;
        p.camera.z = (p.world.z || 0) - camZ;
        p.screen.scale = cameraDepth / p.camera.z;
        p.screen.x = Math.round(W / 2 + p.screen.scale * p.camera.x * W / 2);
        p.screen.y = Math.round(H / 2 - p.screen.scale * p.camera.y * H / 2);
        p.screen.w = Math.round(p.screen.scale * roadWidth * W / 2);
      }
      function rumbleWidth(w) { return w / Math.max(6, 2 * lanes); }
      function laneWidthPx(w) { return w / Math.max(32, 8 * lanes); }

      function drawSegment(x1, y1, w1, x2, y2, w2, fog, color) {
        const r1 = rumbleWidth(w1), r2 = rumbleWidth(w2), l1 = laneWidthPx(w1), l2 = laneWidthPx(w2);
        ctx.fillStyle = color.grass;
        ctx.fillRect(-8, y2, W + 16, y1 - y2);
        poly(ctx, [[x1 - w1 - r1, y1], [x1 - w1, y1], [x2 - w2, y2], [x2 - w2 - r2, y2]], color.rumble);
        poly(ctx, [[x1 + w1 + r1, y1], [x1 + w1, y1], [x2 + w2, y2], [x2 + w2 + r2, y2]], color.rumble);
        poly(ctx, [[x1 - w1, y1], [x1 + w1, y1], [x2 + w2, y2], [x2 - w2, y2]], color.road);
        if (color.lane) {
          const lw1 = w1 * 2 / lanes, lw2 = w2 * 2 / lanes;
          let lx1 = x1 - w1 + lw1, lx2 = x2 - w2 + lw2;
          for (let l = 1; l < lanes; lx1 += lw1, lx2 += lw2, l++)
            poly(ctx, [[lx1 - l1 / 2, y1], [lx1 + l1 / 2, y1], [lx2 + l2 / 2, y2], [lx2 - l2 / 2, y2]], color.lane);
        }
        if (fog < 1) {
          ctx.globalAlpha = 1 - fog; ctx.fillStyle = COLORS.FOG;
          ctx.fillRect(-8, y1, W + 16, y2 - y1); ctx.globalAlpha = 1;
        }
      }

      function renderSprite(src, scale, destX, destY, offsetX, offsetY, clipY, fog) {
        const destW = (src.w * scale * W / 2) * (SPRITE_SCALE * roadWidth);
        const destH = (src.h * scale * W / 2) * (SPRITE_SCALE * roadWidth);
        destX += destW * (offsetX || 0);
        destY += destH * (offsetY || 0);
        const clipH = clipY ? Math.max(0, destY + destH - clipY) : 0;
        if (clipH < destH && destW > 0.4) {
          if (fog !== undefined && fog < 1) ctx.globalAlpha = limit(0.10 + fog * 0.90, 0, 1);
          ctx.drawImage(src.img, 0, 0, src.w, src.h - (src.h * clipH / destH),
            destX, destY, destW, destH - (destH * clipH / destH));
          ctx.globalAlpha = 1;
        }
      }

      function drawLayer(img, offsetX, y) {
        const w = img.width;
        let x = -(((offsetX % w) + w) % w);
        while (x < W + 2) { ctx.drawImage(img, Math.round(x), Math.round(y)); x += w; }
      }

      function lerpColor(a, b, amount) {
        const ah = parseInt(a.replace(/#/g, ''), 16),
          ar = ah >> 16, ag = (ah >> 8) & 0xff, ab = ah & 0xff,
          bh = parseInt(b.replace(/#/g, ''), 16),
          br = bh >> 16, bg = (bh >> 8) & 0xff, bb = bh & 0xff,
          rr = ar + amount * (br - ar),
          rg = ag + amount * (bg - ag),
          rb = ab + amount * (bb - ab);
        return '#' + (16777216 + (rr << 16) + (rg << 8) + rb | 0).toString(16).slice(1);
      }

      function drawBackground() {
        let t = 0;
        if (typeof gameTime !== 'undefined') t = Math.min(1, gameTime / 22);

        const c1 = lerpColor('#2b6ec4', '#0a0b1c', t);
        const c2 = lerpColor('#66aee0', '#151b3d', t);
        const c3 = lerpColor('#c6d9d2', '#2b2c4c', t);
        const c4 = lerpColor('#f0dfab', '#402435', t);

        let skyGrad = ctx.createLinearGradient(0, 0, 0, HORIZON + 10);
        skyGrad.addColorStop(0, c1);
        skyGrad.addColorStop(0.45, c2);
        skyGrad.addColorStop(0.78, c3);
        skyGrad.addColorStop(1, c4);

        ctx.fillStyle = skyGrad; ctx.fillRect(-8, -8, W + 16, HORIZON + 12);

        // sun
        if (typeof gameTime === 'undefined' || gameTime <= 22) {
          const sx = W * 0.72 - (skyOffset * 0.06) % (W * 1.6);
          const sy = HORIZON - 96 + (216 * t);
          ctx.save();
          const gr = ctx.createRadialGradient(sx, sy, 4, sx, sy, 110);
          gr.addColorStop(0, 'rgba(255,246,200,.95)');
          gr.addColorStop(0.25, 'rgba(255,214,120,.55)');
          gr.addColorStop(1, 'rgba(255,190,90,0)');
          ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(sx, sy, 110, 0, PI * 2); ctx.fill();
          ctx.fillStyle = '#fff6cf'; ctx.beginPath(); ctx.arc(sx, sy, 26, 0, PI * 2); ctx.fill();
          ctx.restore();
        }

        // moon
        if (typeof gameTime !== 'undefined' && gameTime > 22) {
          let mt = Math.min(1, (gameTime - 22) / 10);
          const mx = W * 0.28 - (skyOffset * 0.06) % (W * 1.6);
          const my = HORIZON + 120 - (216 * mt);
          ctx.save();
          const mgr = ctx.createRadialGradient(mx, my, 4, mx, my, 80);
          mgr.addColorStop(0, 'rgba(255,255,255,.8)');
          mgr.addColorStop(0.3, 'rgba(200,200,255,.4)');
          mgr.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = mgr; ctx.beginPath(); ctx.arc(mx, my, 80, 0, PI * 2); ctx.fill();
          ctx.fillStyle = '#eef'; ctx.beginPath(); ctx.arc(mx, my, 22, 0, PI * 2); ctx.fill();
          ctx.restore();
        }
        // ground base
        ctx.fillStyle = COLORS.GROUND; ctx.fillRect(-8, HORIZON, W + 16, H - HORIZON + 8);
        // parallax layers
        const py = limit(playerY * 0.0035, -70, 70);
        drawLayer(CLOUDS, skyOffset * 0.55, HORIZON - CLOUDS.h - 58 + py * 0.4);
        drawLayer(MOUNTAINS, hillOffset, HORIZON - MOUNTAINS.h + 8 + py * 0.7);
        drawLayer(DUNES, duneOffset, HORIZON - DUNES.h + 14 + py);
        // heat haze band at horizon
        ctx.globalAlpha = 0.35; ctx.fillStyle = COLORS.FOG;
        ctx.fillRect(-8, HORIZON - 6, W + 16, 14); ctx.globalAlpha = 1;
      }

      /* =========================================================================
         9. DUST PARTICLES
         ========================================================================= */
      function spawnDust(x, y, power) {
        dust.push({
          x: x, y: y, vx: (rnd() - 0.5) * 70 * power, vy: -(20 + rnd() * 50) * power,
          r: 6 + rnd() * 16 * power, life: 0.45 + rnd() * 0.4, t: 0
        });
        if (dust.length > 170) dust.shift();
      }
      function updateDust(dt) {
        for (let i = dust.length - 1; i >= 0; i--) {
          const d = dust[i]; d.t += dt;
          d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 40 * dt; d.r += 26 * dt;
          if (d.t >= d.life) dust.splice(i, 1);
        }
      }
      function drawDust() {
        dust.forEach(d => {
          const a = (1 - d.t / d.life) * 0.42;
          ctx.fillStyle = 'rgba(226,204,155,' + a.toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, PI * 2); ctx.fill();
        });
      }

      /* =========================================================================
         10. AI TRAFFIC
         ========================================================================= */
      function updateCarOffset(car, carSeg, playerSeg) {
        const lookahead = 20, carW = car.sprite.w * SPRITE_SCALE;
        if (carSeg.index - playerSeg.index > drawDistance) return 0;
        for (let i = 1; i < lookahead; i++) {
          const seg = segments[(carSeg.index + i) % segments.length];
          if (seg === playerSeg && car.speed > speed && overlap(playerX, playerW, car.offset, carW, 1.25)) {
            let dir;
            if (playerX > 0.5) dir = -1; else if (playerX < -0.5) dir = 1; else dir = (car.offset > playerX) ? 1 : -1;
            return dir * (1 / i) * (car.speed - speed) / maxSpeed;
          }
          for (let k = 0; k < seg.cars.length; k++) {
            const other = seg.cars[k], oW = other.sprite.w * SPRITE_SCALE;
            if (car.speed > other.speed && overlap(car.offset, carW, other.offset, oW, 1.25)) {
              return ((other.offset > car.offset) ? -1 : 1) * (1 / i) * (car.speed - other.speed) / maxSpeed;
            }
          }
        }
        if (car.offset < -0.92) return 0.1;
        if (car.offset > 0.92) return -0.1;
        return 0;
      }
      function updateCars(dt, playerSeg) {
        for (let i = 0; i < cars.length; i++) {
          const car = cars[i], oldSeg = findSegment(car.z);
          car.offset = limit(car.offset + updateCarOffset(car, oldSeg, playerSeg), -1.6, 1.6);
          car.z = increase(car.z, dt * car.speed, trackLength);
          car.percent = percentRemaining(car.z, segmentLength);
          const newSeg = findSegment(car.z);
          if (oldSeg !== newSeg) {
            const k = oldSeg.cars.indexOf(car);
            if (k >= 0) oldSeg.cars.splice(k, 1);
            newSeg.cars.push(car);
          }
        }
      }

      /* =========================================================================
         11. UPDATE
         ========================================================================= */
      function say(text, dur, color) { msg = { text: text, t: dur || 1.6, color: color || '#ffe6a0' }; }

      function onCheckpoint() {
        timeLeft += cpBonus; score += 3000; flashCP = 1.2;
        say('CHECKPOINT  +' + cpBonus + 's', 1.8, '#a9e9ff');
        Sound.blip(880, 0.12); setTimeout(() => Sound.blip(1320, 0.18), 110);
      }
      function onLap() {
        lastLapTime = currentLapTime;
        if (bestLapTime === null || currentLapTime < bestLapTime) {
          bestLapTime = currentLapTime;
          if (lap > 1) say('NEW BEST LAP!', 2.0, '#b6ffb0');
        }
        currentLapTime = 0; nextCP = 0; lap++;
        if (lap > totalLaps) {
          state = 'finish'; stateTimer = 0;
          score += Math.round(timeLeft * 250);
          Sound.blip(660, 0.2); setTimeout(() => Sound.blip(990, 0.3), 180);
          return;
        }
        timeLeft += lapBonus; score += 5000;
        say('LAP ' + lap + ' / ' + totalLaps + '   +' + lapBonus + 's', 2.0, '#ffd98a');
        Sound.blip(760, 0.16);
      }

      function update(dt) {
        const playerSeg = findSegment(position + playerZ);
        const playerPct = percentRemaining(position + playerZ, segmentLength);
        playerY = interpolate(playerSeg.p1.world.y, playerSeg.p2.world.y, playerPct);

        const prevAlt = playerAltitude;
        jumpVel -= 6000 * dt;
        playerAltitude += jumpVel * dt;

        if (playerAltitude <= playerY) {
          if (isJumping && jumpVel < -1000) {
            shake = Math.max(shake, 3);
            for (let k = 0; k < 10; k++) spawnDust(W / 2 + (rnd() - 0.5) * 90, H - 40 + rnd() * 20, 0.8);
            Sound.blip(150, 0.2, 'sawtooth', 0.4);
          }
          jumpVel = (playerY - prevAlt) / dt;
          if (jumpVel > 2000) jumpVel = 2000 + (jumpVel - 2000) * 0.3;
          playerAltitude = playerY;
          isJumping = false;
        } else {
          isJumping = true;
        }

        const speedPct = speed / maxSpeed;
        const startPosition = position;
        const racing = (state === 'racing');

        updateCars(dt, playerSeg);

        // ---- steering ----
        const dx = dt * 2.4 * speedPct;
        if (racing) {
          if (keys.left) playerX -= dx;
          if (keys.right) playerX += dx;
        }
        playerX -= dx * speedPct * playerSeg.curve * centrifugal;

        // ---- throttle / nitro ----
        boosting = racing && keys.nitro && nitro > 0 && speed > maxSpeed * 0.25;
        const capped = maxSpeed * (boosting ? nitroFactor : 1);
        if (racing) {
          if (keys.gas) speed = accelerate(speed, accelRate * (boosting ? 2.1 : 1), dt);
          else if (keys.brake) speed = accelerate(speed, brakeRate, dt);
          else speed = accelerate(speed, decelRate, dt);
        } else {
          speed = accelerate(speed, decelRate * 1.4, dt);
        }
        if (boosting) nitro = limit(nitro - dt * 0.30, 0, 1);
        else nitro = limit(nitro + dt * 0.055, 0, 1);

        // ---- off-road / collisions ----
        const off = (playerX < -1 || playerX > 1);
        if (off) {
          if (speed > offRoadLimit) speed = accelerate(speed, offRoadDecel, dt);
          shake = Math.max(shake, 1.2 + speedPct * 3.2);
          for (let n = 0; n < playerSeg.sprites.length; n++) {
            const sp = playerSeg.sprites[n];
            if (sp.source.nc) continue;
            const spW = sp.source.w * SPRITE_SCALE;
            if (overlap(playerX, playerW, sp.offset + spW / 2 * (sp.offset > 0 ? 1 : -1), spW)) {
              speed = maxSpeed / 6;
              position = increase(playerSeg.p1.world.z, -playerZ, trackLength);
              shake = 9; Sound.crash();
              for (let k = 0; k < 24; k++) spawnDust(W / 2 + (rnd() - 0.5) * 190, H - 70 + rnd() * 40, 1.5);
              score = Math.max(0, score - 500);
              break;
            }
          }
        }
        for (let n = 0; n < playerSeg.cars.length; n++) {
          const car = playerSeg.cars[n], carW = car.sprite.w * SPRITE_SCALE;
          if (speed > car.speed && overlap(playerX, playerW, car.offset, carW, 0.82)) {
            speed = car.speed * (car.speed / speed);
            position = increase(car.z, -playerZ, trackLength);
            shake = 7; Sound.crash();
            for (let k = 0; k < 14; k++) spawnDust(W / 2 + (rnd() - 0.5) * 150, H - 90 + rnd() * 40, 1.2);
            break;
          }
        }

        // ---- integrate ----
        position = increase(position, dt * speed, trackLength);
        playerX = limit(playerX, -3.2, 3.2);
        speed = limit(speed, 0, capped);

        // parallax offsets
        const dzn = dt * speed / segmentLength;
        skyOffset += 0.62 * playerSeg.curve * dzn;
        hillOffset += 1.60 * playerSeg.curve * dzn;
        duneOffset += 3.10 * playerSeg.curve * dzn;

        // dust from tyres
        const dustPower = off ? 1.5 : (speedPct > 0.35 ? 0.55 : 0);
        if (dustPower > 0 && rnd() < 0.9) {
          spawnDust(W / 2 - 78 + rnd() * 16, H - 46 + rnd() * 16, dustPower);
          spawnDust(W / 2 + 62 + rnd() * 16, H - 46 + rnd() * 16, dustPower);
        }
        updateDust(dt);
        shake = Math.max(0, shake - dt * 12);

        // ---- timing / progress ----
        if (racing) {
          gameTime += dt;
          currentLapTime += dt;
          timeLeft -= dt;
          odo += speed * dt;
          score += speed * dt * 0.02;
          if (position < startPosition && (startPosition - position) > trackLength / 2) onLap();
          if (nextCP < checkpoints.length && position >= checkpoints[nextCP].z) { onCheckpoint(); nextCP++; }
          if (timeLeft <= 0) {
            timeLeft = 0; state = 'over'; stateTimer = 0;
            Sound.blip(220, 0.5, 'sawtooth', 0.25);
          }
          if (timeLeft <= 5.02 && Math.floor(timeLeft) !== Math.floor(timeLeft + dt)) Sound.blip(1200, 0.09, 'square', 0.2);
        }
        if (msg) { msg.t -= dt; if (msg.t <= 0) msg = null; }
        flashCP = Math.max(0, flashCP - dt);

        Sound.update(speed / maxSpeed, off && speed > 60, boosting, !racing);
        return playerSeg;
      }

      /* =========================================================================
         12. RENDER
         ========================================================================= */
      function drawPlayer(speedPct, scale, destX, destY, shadowY, steer, updown) {
        const bounce = (1.6 * rnd() * speedPct) * randomChoice([-1, 1]) + (Math.abs(updown) > 0 ? 0.6 : 0);

        if (shadowY !== undefined) {
          const jumpH = Math.max(0, shadowY - destY);
          const shScale = Math.max(0.3, 1 - jumpH / 160);
          const sw = 84 * scale * (SPRITE_SCALE * roadWidth) * (W / 2) * shScale;
          const sh = 10 * scale * (SPRITE_SCALE * roadWidth) * (W / 2) * shScale;
          ctx.save();
          ctx.fillStyle = 'rgba(0,0,0,' + (0.38 * shScale) + ')';
          ctx.beginPath(); ctx.ellipse(destX, shadowY, sw, sh, 0, 0, PI * 2); ctx.fill();
          ctx.restore();
        }

        let sprite;
        if (steer < 0) sprite = PLAYER_LEFT;
        else if (steer > 0) sprite = PLAYER_RIGHT;
        else sprite = PLAYER_STRAIGHT;
        renderSprite(sprite, scale, destX, destY + bounce, -0.5, -1, 0, 1);
      }

      function speedLines(pct) {
        if (pct < 0.72) return;
        const n = Math.floor((pct - 0.72) * 46);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.05 + (pct - 0.72) * 0.5).toFixed(2) + ')';
        ctx.lineWidth = 2;
        for (let i = 0; i < n; i++) {
          const side = i % 2 ? 1 : -1;
          const y = HORIZON + 20 + rnd() * (H - HORIZON - 30);
          const x = W / 2 + side * (120 + rnd() * W / 2);
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + side * (20 + rnd() * 40), y + 6); ctx.stroke();
        }
      }

      function renderWorld() {
        const baseSeg = findSegment(position);
        const basePct = percentRemaining(position, segmentLength);
        const playerSeg = findSegment(position + playerZ);
        const playerPct = percentRemaining(position + playerZ, segmentLength);
        const py = interpolate(playerSeg.p1.world.y, playerSeg.p2.world.y, playerPct);
        let maxy = H, x = 0, dxc = -(baseSeg.curve * basePct);

        drawBackground();

        // --- road ---
        for (let n = 0; n < drawDistance; n++) {
          const seg = segments[(baseSeg.index + n) % segments.length];
          seg.looped = seg.index < baseSeg.index;
          seg.fog = expFog(n / drawDistance, fogDensity);
          seg.clip = maxy;
          project(seg.p1, (playerX * roadWidth) - x, py + cameraHeight, position - (seg.looped ? trackLength : 0));
          project(seg.p2, (playerX * roadWidth) - x - dxc, py + cameraHeight, position - (seg.looped ? trackLength : 0));
          x += dxc; dxc += seg.curve;
          if (seg.p1.camera.z <= cameraDepth) continue;
          if (seg.p2.screen.y >= seg.p1.screen.y) continue;
          if (seg.p2.screen.y >= maxy) continue;
          drawSegment(seg.p1.screen.x, seg.p1.screen.y, seg.p1.screen.w,
            seg.p2.screen.x, seg.p2.screen.y, seg.p2.screen.w,
            seg.fog, seg.color);
          maxy = seg.p2.screen.y;
        }

        // --- sprites & traffic (far -> near) ---
        for (let n = drawDistance - 1; n > 0; n--) {
          const seg = segments[(baseSeg.index + n) % segments.length];
          for (let i = 0; i < seg.cars.length; i++) {
            const car = seg.cars[i];
            const sc = interpolate(seg.p1.screen.scale, seg.p2.screen.scale, car.percent);
            const cx = interpolate(seg.p1.screen.x, seg.p2.screen.x, car.percent) + sc * car.offset * roadWidth * W / 2;
            const cy = interpolate(seg.p1.screen.y, seg.p2.screen.y, car.percent);

            const sw = 84 * (car.sprite.w / 200) * sc * (W / 2) * (SPRITE_SCALE * roadWidth);
            const sh = 10 * sc * (W / 2) * (SPRITE_SCALE * roadWidth);
            ctx.save();
            if (seg.fog < 1) ctx.globalAlpha = limit(0.10 + seg.fog * 0.90, 0, 1);
            ctx.fillStyle = 'rgba(0,0,0,0.38)';
            ctx.beginPath(); ctx.ellipse(cx, cy, sw, sh, 0, 0, PI * 2); ctx.fill();
            ctx.restore();

            renderSprite(car.sprite, sc, cx, cy, -0.5, -1, seg.clip, seg.fog);
          }
          for (let i = 0; i < seg.sprites.length; i++) {
            const sp = seg.sprites[i];
            const sc = seg.p1.screen.scale;
            const sx = seg.p1.screen.x + sc * sp.offset * roadWidth * W / 2;
            const sy = seg.p1.screen.y;
            renderSprite(sp.source, sc, sx, sy, sp.center ? -0.5 : (sp.offset < 0 ? -1 : 0), -1, seg.clip, seg.fog);
          }
        }

        drawDust();
        speedLines(speed / maxSpeed);

        // --- player ---
        const roadCamY = interpolate(playerSeg.p1.camera.y, playerSeg.p2.camera.y, playerPct);
        const shadowScreenY = (H / 2) - (cameraDepth / playerZ) * roadCamY * H / 2;
        const jumpOffset = Math.max(0, playerAltitude - playerY);
        const truckScreenY = shadowScreenY - (cameraDepth / playerZ) * jumpOffset * H / 2;

        drawPlayer(speed / maxSpeed, cameraDepth / playerZ, W / 2,
          truckScreenY, shadowScreenY,
          speed * ((keys.left && state === 'racing') ? -1 : (keys.right && state === 'racing') ? 1 : 0),
          playerSeg.p2.world.y - playerSeg.p1.world.y);

        if (boosting) {
          ctx.fillStyle = 'rgba(255,140,40,0.10)'; ctx.fillRect(-8, -8, W + 16, H + 16);
        }
        return playerSeg;
      }

      /* ---- HUD ---------------------------------------------------------------- */
      function txt(s, x, y, size, color, align, weight) {
        ctx.font = (weight || 'bold') + ' ' + size + 'px "Courier New",Courier,monospace';
        ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
        ctx.lineWidth = Math.max(3, size / 7); ctx.strokeStyle = 'rgba(20,12,4,.85)';
        ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y);
      }
      function panel(x, y, w, h, a) {
        ctx.fillStyle = 'rgba(18,12,5,' + (a || 0.55) + ')'; ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = 'rgba(255,214,120,.55)'; ctx.lineWidth = 2; ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
      }

      function drawHUD(playerSeg) {
        const mph = Math.round(speed / maxSpeed * 186);

        // top-left : speed
        panel(8, 8, 190, 54, 0.5);
        txt('SPEED', 14, 26, 15, '#ffd479');
        txt(pad(mph, 3), 16, 56, 30, '#fffbe8');
        txt('MPH', 108, 56, 17, '#ffd479');
        // nitro bar
        panel(8, 66, 190, 20, 0.5);
        txt('NITRO', 12, 81, 12, '#ffd479');
        ctx.fillStyle = '#3a2a12'; ctx.fillRect(62, 71, 128, 10);
        const ng = ctx.createLinearGradient(62, 0, 190, 0);
        ng.addColorStop(0, '#ff7a1f'); ng.addColorStop(1, '#ffe14d');
        ctx.fillStyle = boosting ? '#fff2b0' : ng; ctx.fillRect(62, 71, 128 * nitro, 10);
        ctx.strokeStyle = '#1a1207'; ctx.lineWidth = 1; ctx.strokeRect(62.5, 71.5, 127, 9);

        // top-center : time
        const urgent = timeLeft < 10 && Math.floor(timeLeft * 4) % 2 === 0;
        panel(W / 2 - 72, 8, 144, 54, 0.5);
        txt('TIME', W / 2, 26, 15, '#ffd479', 'center');
        txt(pad(Math.ceil(timeLeft), 2), W / 2, 56, 30, urgent ? '#ff5a3c' : '#fffbe8', 'center');

        // top-right : score / lap
        panel(W - 206, 8, 198, 78, 0.5);
        txt('SCORE', W - 200, 26, 15, '#ffd479');
        txt(pad(score, 8), W - 12, 26, 20, '#fffbe8', 'right');
        txt('LAP  ' + Math.min(lap, totalLaps) + '/' + totalLaps, W - 200, 50, 16, '#fffbe8');
        txt('BEST ' + fmtTime(bestLapTime), W - 200, 70, 14, '#a9e9ff');
        txt(fmtTime(currentLapTime), W - 12, 50, 16, '#b6ffb0', 'right');

        // lap progress bar
        const prog = (position / trackLength);
        panel(8, H - 26, W - 16, 18, 0.45);
        ctx.fillStyle = '#3a2a12'; ctx.fillRect(12, H - 22, W - 24, 10);
        ctx.fillStyle = '#ffb03a'; ctx.fillRect(12, H - 22, (W - 24) * prog, 10);
        checkpoints.forEach(cp => {
          ctx.fillStyle = '#a9e9ff'; ctx.fillRect(12 + (W - 24) * (cp.z / trackLength) - 1, H - 24, 3, 14);
        });
        ctx.fillStyle = '#fff'; ctx.fillRect(12 + (W - 24) * prog - 2, H - 24, 4, 14);

        // curve warning arrows (Rad-Racer style)
        const ahead = segments[(playerSeg.index + 34) % segments.length].curve;
        if (Math.abs(ahead) > 2.4 && Math.floor(performance.now() / 220) % 2 === 0) {
          const dir = ahead > 0 ? '>' : '<';
          txt(dir + dir + dir, W / 2, HORIZON - 34, 34, ahead > 0 ? '#ffe14d' : '#ffe14d', 'center');
        }
        if (flashCP > 0) {
          ctx.globalAlpha = Math.min(0.35, flashCP * 0.4);
          ctx.fillStyle = '#a9e9ff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
        }
        if (msg) {
          const a = Math.min(1, msg.t * 2);
          ctx.globalAlpha = a;
          txt(msg.text, W / 2, HORIZON + 58, 26, msg.color, 'center');
          ctx.globalAlpha = 1;
        }
        if (!Sound.on) txt('MUTE', 8, H - 34, 13, '#ff9d9d');
      }

      function drawOverlays() {
        if (state === 'title') {
          ctx.fillStyle = 'rgba(10,7,2,.55)'; ctx.fillRect(0, 0, W, H);
          panel(W / 2 - 250, 72, 500, 290, 0.72);
          txt('B A J A   B L A S T', W / 2, 132, 40, '#ffd479', 'center');
          txt('DESERT TRUCK CHALLENGE', W / 2, 162, 18, '#fffbe8', 'center');
          txt('3 LAPS · BEAT THE CLOCK · CHECKPOINTS ADD TIME', W / 2, 202, 13, '#e9d9a8', 'center');
          txt('↑ GAS    ↓ BRAKE    ← → STEER', W / 2, 236, 16, '#a9e9ff', 'center');
          txt('SHIFT / SPACE = NITRO', W / 2, 260, 16, '#ffb03a', 'center');
          txt('P PAUSE     M SOUND', W / 2, 284, 14, '#e9d9a8', 'center');
          if (Math.floor(performance.now() / 450) % 2 === 0)
            txt('PRESS ENTER OR TAP TO START', W / 2, 332, 20, '#fffbe8', 'center');
        }
        if (state === 'countdown') {
          const n = Math.ceil(stateTimer - 0.4);
          const label = n > 0 ? '' + n : 'GO!';
          const sc = 1 + (1 - ((stateTimer * 2) % 1)) * 0.25;
          ctx.save(); ctx.translate(W / 2, HORIZON + 10); ctx.scale(sc, sc);
          txt(label, 0, 0, n > 0 ? 86 : 70, n > 0 ? '#fffbe8' : '#8dff7a', 'center');
          ctx.restore();
        }
        if (state === 'paused') {
          ctx.fillStyle = 'rgba(10,7,2,.55)'; ctx.fillRect(0, 0, W, H);
          txt('PAUSED', W / 2, H / 2, 46, '#ffd479', 'center');
          txt('PRESS P TO RESUME', W / 2, H / 2 + 34, 16, '#fffbe8', 'center');
        }
        if (state === 'over' || state === 'finish') {
          ctx.fillStyle = 'rgba(10,7,2,.62)'; ctx.fillRect(0, 0, W, H);
          panel(W / 2 - 230, 110, 460, 230, 0.75);
          const win = state === 'finish';
          txt(win ? 'RACE COMPLETE!' : 'TIME UP', W / 2, 162, 38, win ? '#8dff7a' : '#ff6a4a', 'center');
          txt('SCORE   ' + pad(score, 8), W / 2, 208, 22, '#fffbe8', 'center');
          txt('BEST LAP  ' + fmtTime(bestLapTime), W / 2, 240, 18, '#a9e9ff', 'center');
          txt('DISTANCE  ' + (odo / 1000).toFixed(2) + ' km', W / 2, 266, 18, '#e9d9a8', 'center');
          if (Math.floor(performance.now() / 420) % 2 === 0)
            txt('PRESS ENTER TO RACE AGAIN', W / 2, 312, 17, '#ffd479', 'center');
        }
      }

      /* =========================================================================
         13. MAIN LOOP
         ========================================================================= */
      let last = performance.now(), acc = 0;
      const STEP = 1 / 60;

      function frame(now) {
        let dt = (now - last) / 1000; last = now;
        if (dt > 0.25) dt = 0.25;
        acc += dt;

        let playerSeg = findSegment(position + playerZ);
        while (acc >= STEP) {
          if (state === 'countdown') {
            stateTimer -= STEP;
            if (stateTimer <= 0.4 && stateTimer + STEP > 0.4) Sound.blip(1000, 0.25, 'square', 0.22);
            else if (Math.ceil(stateTimer - 0.4) !== Math.ceil(stateTimer - 0.4 + STEP) && stateTimer > 0.4) Sound.blip(600, 0.12);
            if (stateTimer <= 0) { state = 'racing'; }
          }
          if (state !== 'paused') playerSeg = update(STEP, playerSeg);
          acc -= STEP;
        }

        ctx.save();
        if (shake > 0.2) ctx.translate((rnd() - 0.5) * shake, (rnd() - 0.5) * shake);
        playerSeg = renderWorld();
        ctx.restore();

        drawHUD(playerSeg);
        drawOverlays();

        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && state === 'racing') state = 'paused';
      });

    })();
  </script>
</body>
